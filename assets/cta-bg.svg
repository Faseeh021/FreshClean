<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 500" preserveAspectRatio="xMidYMid slice">
  <!-- Placeholder CTA background: pressure washing scene - replace with real photo -->
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141414"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <pattern id="pave" width="160" height="120" patternUnits="userSpaceOnUse">
      <rect width="160" height="120" fill="url(#wash)"/>
      <rect x="6" y="6" width="70" height="50" rx="3" fill="#1c1c1c"/>
      <rect x="84" y="6" width="70" height="50" rx="3" fill="#181818"/>
      <rect x="6" y="64" width="70" height="50" rx="3" fill="#181818"/>
      <rect x="84" y="64" width="70" height="50" rx="3" fill="#1c1c1c"/>
    </pattern>
    <!-- spray fan -->
    <linearGradient id="spray" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7EC427" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7EC427" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="500" fill="url(#pave)"/>
  <polygon points="900,180 1400,80 1400,300" fill="url(#spray)"/>
  <rect x="820" y="160" width="90" height="18" rx="9" transform="rotate(18 820 160)" fill="#3a3a3a"/>
</svg>
